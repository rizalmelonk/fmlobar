<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SI FM Lobar – Sistem Informasi Front Mahasiswa Lombok Barat</title>
<style>
:root{--side:16213E;--sidetx:E6EAF5;--accent:F2C300;--yellow:F2C300;--blue:1F5FA8;--red:D62828;--surface:fff;--navy:0B1F5C;--bg:F1F3F7;--card:fff;--text:1B2236;--muted:5B6479;--line:E2E5EC;--foot:E4E6EA;--link:0B6B2E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:101B45;--bg:0C1226;--card:141D3B;--text:EEF1F9;--muted:A5AFCB;--line:26336A;--foot:1D2850;--link:7BE0A0}}
:root[data-theme="dark"]{--surface:101B45;--bg:0C1226;--card:141D3B;--text:EEF1F9;--muted:A5AFCB;--line:26336A;--foot:1D2850;--link:7BE0A0}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 "Source Sans Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100%}
aside{width:230px;flex:none;background:var(--side);color:var(--sidetx);transition:margin .2s}
.logo{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:800;font-size:1.25rem;letter-spacing:.02em}
.logo img{height:40px;background:fff;border-radius:6px}
.who{display:flex;align-items:center;gap:10px;padding:14px 16px;border-block:1px solid rgba(255,255,255,.1)}
.who i{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.8rem}
.who b{display:block;font-size:.9rem}
.who span{background:fff;color:222;border-radius:3px;font-size:.65rem;font-weight:700;padding:0 5px}
aside nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;color:var(--sidetx);text-decoration:none;font-weight:600}
aside nav a:hover{background:rgba(255,255,255,.08)}
aside nav a[aria-current]{background:rgba(242,195,0,.15);box-shadow:inset 3px 0 var(--accent);color:var(--accent)}
aside nav small{opacity:.6}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--line);padding:10px 18px}
.top button{background:none;border:0;color:var(--text);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.top .r{display:flex;gap:16px;align-items:center;color:var(--muted);font-weight:600}
.content{padding:20px 18px 40px}
h1{margin:0 0 14px;font-size:1.35rem;letter-spacing:.01em}
.box{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat{background:var(--card);border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column}
.stat .in{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;flex:1}
.stat strong{display:block;font-size:2rem;line-height:1.1}
.stat .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--c)}
.stat a{background:var(--foot);color:var(--link);text-align:center;padding:3px;font-weight:700;text-decoration:none;font-size:.85rem}
.stat a:hover{text-decoration:underline}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.card h2{margin:0;padding:10px 14px;font-size:.95rem;border-bottom:1px solid var(--line)}
.card .bd{padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.72rem;color:var(--muted)}
.leg i{display:inline-block;width:28px;height:9px;margin-right:5px;vertical-align:middle;border-radius:2px}
svg.donut{width:min(250px,100%);height:auto}
.note{color:var(--muted);font-size:.8rem;margin:16px 0 0}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
@media(max-width:700px){aside{position:fixed;inset:0 auto 0 0;z-index:5;margin-left:-240px}body.open aside{margin-left:0}}
@media(max-width:480px){.stats{grid-template-columns:1fr}}
body.closed aside{margin-left:-230px}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{background:var(--foot);font-size:.8rem}
.wrapx{overflow-x:auto}
.b{border:0;border-radius:3px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;background:var(--navy);color:fff}
.b.ok{background:1E8E4A}.b.no{background:C0392B}.b.ln{background:transparent;color:var(--text);border:1px solid var(--line)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.75rem;font-weight:700;background:var(--foot)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.sub{margin:-6px 0 14px;color:var(--muted)}
dialog{border:0;border-radius:8px;padding:20px;background:var(--card);color:var(--text);max-width:96vw}
dialog::backdrop{background:rgba(0,0,0,.55)}
.kta{width:340px;max-width:100%;aspect-ratio:1.586;border-radius:12px;overflow:hidden;background:fff;color:0B1F5C;border:1px solid 9AA6CC;display:flex;flex-direction:column;margin:0 auto;font-family:inherit}
.kta .bd{height:12px;background:linear-gradient(F2C300 0 65%,D62828 65%)}
.kta .hd{display:flex;align-items:center;gap:8px;padding:6px 12px;background:0B1F5C;color:fff;font-size:.62rem;line-height:1.2}
.kta .hd img{height:34px;background:fff;border-radius:4px}
.kta .hd b{display:block;font-size:.85rem;letter-spacing:.05em}
.kta .cn{display:flex;gap:12px;padding:10px 12px;flex:1}
.kta .ph{width:70px;height:88px;border-radius:4px;background:DCE3F5;display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:1F5FA8;flex:none}
.kta dl{margin:0;font-size:.68rem;line-height:1.35}
.kta dt{color:55607A;font-size:.58rem}
.kta dd{margin:0 0 3px;font-weight:700}
.kta dd.nm{font-size:.92rem}
.kta .ft{background:F2C300;font-weight:800;font-size:.7rem;text-align:center;padding:3px}
.act{display:flex;gap:8px;justify-content:center;margin-top:16px}


.dn{width:220px;max-width:100%;aspect-ratio:1;border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent 52%,000 53%);mask:radial-gradient(farthest-side,transparent 52%,000 53%)}
.kta img.ph{object-fit:cover;display:block}
.stats{margin-bottom:16px}
.plain{display:grid;place-items:start center;padding:32px 16px;min-height:100vh}
.formbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px}
.formbox.wide{max-width:520px}
.flogo{height:64px;background:fff;border-radius:6px;margin-bottom:8px}
.formbox label{display:block;font-weight:600;margin-bottom:12px}
.formbox input,.formbox select{display:block;width:100%;margin-top:4px;padding:9px 10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text)}
.alert{background:FDE7E7;color:8A1C1C;padding:8px 12px;border-radius:4px;margin:0 0 12px}
.alert.okmsg{background:E3F5E9;color:14602F}
.srch{display:flex;gap:8px;margin-bottom:12px}
.srch input{padding:7px 10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text)}
.foto{width:38px;height:48px;object-fit:cover;border-radius:3px}
.inl{display:inline}
@media print{.app>aside,.top,.noprint,h1{display:none!important}.content{padding:0}body{background:fff}.kta{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0}}
.pub a{color:inherit}.pub .wrap{max-width:1080px;margin:0 auto;padding:0 20px}.pub header{border-bottom:1px solid var(--line);background:var(--surface)}.pub .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;flex-wrap:wrap}.pub .brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-stretch:115%;letter-spacing:.02em}.pub .brand img{height:44px;width:auto;background:#fff;border-radius:6px}.pub nav{display:flex;gap:20px;flex-wrap:wrap;font-size:.95rem}.pub nav a{text-decoration:none;color:var(--muted);font-weight:500}.pub nav a:hover{color:var(--text)}.pub .btn{display:inline-block;padding:12px 22px;font-weight:700;text-decoration:none;border-radius:4px;border:2px solid var(--navy);background:var(--navy);color:#fff}.pub .btn.alt{background:transparent;color:var(--text);border-color:var(--text)}.pub .btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}.pub .hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}.pub .hero::before{content:"";display:block;height:14px;background:linear-gradient(var(--yellow) 0 70%,var(--red) 70%)}.pub .hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}.pub .hero h1{margin:0 0 18px;font-weight:900;font-stretch:125%;font-size:clamp(2.4rem,6.5vw,4.6rem);line-height:1;letter-spacing:.01em}.pub .hero h1 span{display:block;font-size:.34em;font-stretch:100%;font-weight:700;letter-spacing:.08em;margin-top:14px;color:var(--yellow)}.pub .hero p{max-width:46ch;color:#D3DBF2;margin:0 0 28px;font-size:1.1rem}.pub .hero .btn{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}.pub .hero .btn.alt{background:transparent;color:#fff;border-color:#fff}.pub .hero .btn:hover{background:#fff;border-color:#fff;color:var(--navy)}.pub .cta{display:flex;gap:12px;flex-wrap:wrap}.pub .shield{justify-self:center;width:min(300px,70%);aspect-ratio:1;background:#fff;border-radius:50%;display:grid;place-items:center;border:8px solid var(--yellow)}.pub .shield img{width:84%;height:auto}.pub .lstats{background:var(--surface);border-bottom:1px solid var(--line)}.pub .lstats dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0}.pub .lstats div{padding:22px 20px;border-left:4px solid var(--yellow)}.pub .lstats dt{font-size:.9rem;color:var(--muted)}.pub .lstats dd{margin:0;font-weight:800;font-stretch:115%;font-size:1.7rem;color:var(--blue)}.pub section{padding:64px 0}.pub h2{margin:0 0 8px;font-weight:800;font-stretch:112%;font-size:clamp(1.6rem,3.5vw,2.2rem);line-height:1.15}.pub .lead{margin:0 0 36px;color:var(--muted);max-width:56ch}.pub .mods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:48px}.pub .mods li{border-top:2px solid var(--line);padding:20px 0 24px}.pub .mods li:nth-child(4n+1),.pub .mods li:nth-child(4n+4){border-top-color:var(--blue)}.pub .mods a{font-weight:700;font-size:1.2rem;text-decoration:none}.pub .mods a:hover{color:var(--blue);text-decoration:underline}.pub .mods p{margin:6px 0 0;color:var(--muted)}.pub .news{background:var(--surface);border-block:1px solid var(--line)}.pub .news article{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}.pub .news article:first-of-type{border-top:0}.pub .news time{font-weight:700;color:var(--red)}.pub .news h3{margin:0 0 4px;font-size:1.1rem}.pub .news p{margin:0;color:var(--muted)}.pub .join{background:var(--yellow);color:var(--navy);text-align:left}.pub .join .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}.pub .join h2{margin:0}.pub .join p{margin:6px 0 0}.pub .join .btn:hover{background:var(--red);border-color:var(--red)}.pub footer{background:var(--navy);color:#C5CEEA;padding:36px 0;font-size:.95rem}.pub footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}.pub footer strong{color:#fff}@media(max-width:760px){.pub .hero .wrap{grid-template-columns:1fr;padding-top:40px}.pub .shield{order:-1;width:180px}.pub .mods{grid-template-columns:1fr}.pub .mods li:nth-child(n){border-top-color:var(--line)}.pub .news article{grid-template-columns:1fr;gap:4px}.pub section{padding:44px 0}}</style></head>
<body><div id="app"></div>
<template id="t-pub"><div class="pub">
<header>
 <div class="wrap bar">
  <a class="brand" href="#/"><img data-logo src="" alt="Logo FM Lobar"><span>SI FM LOBAR</span></a>
  <nav aria-label="Navigasi utama">
   <a href="#/" data-sc="layanan">Layanan</a><a href="#/" data-sc="gabung">Keanggotaan</a><a href="#/" data-sc="kontak">Kontak</a>
  </nav>
  <a class="btn" href="#/login">Masuk</a>
 </div>
</header>

<main id="beranda">
 <div class="hero">
  <div class="wrap">
   <div>
    <h1>FM LOBAR<span>FRONT MAHASISWA LOMBOK BARAT</span></h1>
    <p>Sistem informasi untuk mengelola pendaftaran pengurus, kader, dan alumni serta menerbitkan KTA mahasiswa Lombok Barat.</p>
    <div class="cta"><a class="btn" href="#/login">Masuk ke sistem</a><a class="btn alt" href="#/daftar">Daftar anggota</a></div>
   </div>
   <div class="shield"><img data-logo src="" alt="Lambang FM Lobar"></div>
  </div>
 </div>

 <div class="lstats">
  <div class="wrap"><dl>
   <div><dt>Anggota aktif</dt><dd data-c="all">0</dd></div>
   <div><dt>Pengurus</dt><dd data-c="Pengurus">0</dd></div>
   <div><dt>Kader</dt><dd data-c="Kader">0</dd></div>
   <div><dt>Alumni</dt><dd data-c="Alumni">0</dd></div>
  </dl></div>
 </div>

 <section id="layanan">
  <div class="wrap">
   <h2>Layanan sistem</h2>
   <p class="lead">Alur dari pendaftaran sampai KTA terbit.</p>
   <ul class="mods">
    <li><a href="#/daftar">Pendaftaran online</a><p>Daftar sebagai pengurus, kader, atau alumni dengan pas foto.</p></li>
    <li><a href="#/login">Konfirmasi admin</a><p>Admin memeriksa data lalu menerima atau menolak pendaftar.</p></li>
    <li><a href="#/login">Data pengurus, kader, dan alumni</a><p>Anggota terverifikasi tersimpan rapi dan bisa dicari.</p></li>
    <li><a href="#/login">KTA otomatis</a><p>Begitu diterima, KTA langsung terbit dan siap dicetak.</p></li>
   </ul>
  </div>
 </section>

  <section class="join" id="gabung">
  <div class="wrap">
   <div><h2>Mahasiswa Lombok Barat? Bergabunglah.</h2><p>Isi formulir pendaftaran dan tunggu verifikasi dari pengurus.</p></div>
   <a class="btn" href="#/daftar">Daftar sekarang</a>
  </div>
 </section>
</main>

<footer id="kontak">
 <div class="wrap">
  <div><strong>Front Mahasiswa Lombok Barat</strong><br>Sekretariat: [alamat sekretariat]</div>
  <div>Email: [alamat email]<br>Instagram: [akun Instagram]</div>
  <div>© 2026 FM Lobar</div>
 </div>
</footer>
</div></template>
